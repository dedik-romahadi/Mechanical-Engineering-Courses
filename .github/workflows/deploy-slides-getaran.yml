name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Siapkan Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Getaran-Mekanik/Slides/package-lock.json

      - name: Install Slidev dependencies
        working-directory: Getaran-Mekanik/Slides
        run: npm ci

      - name: Build Slidev ke subdirektori
        working-directory: Getaran-Mekanik/Slides
        run: |
          npx slidev build Analisis-Getaran-Berbasis-Fourier-Transform.md \
            --base /Mechanical-Engineering-Courses/Getaran-Mekanik/Slides/ \
            --out dist

      - name: Siapkan direktori Pages
        run: |
          mkdir -p _site
          # Copy seluruh repo kecuali .git, node_modules, dan direktori build
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='Getaran-Mekanik/Slides/' \
            . _site/
          # Copy Slidev build ke subdirektori yang benar
          mkdir -p _site/Getaran-Mekanik/Slides
          cp -r Getaran-Mekanik/Slides/dist/. _site/Getaran-Mekanik/Slides/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
