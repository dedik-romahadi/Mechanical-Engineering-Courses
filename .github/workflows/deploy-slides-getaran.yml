name: Deploy Getaran Mekanik Slides ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Getaran-Mekanik/Slides/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-getaran-slides
  cancel-in-progress: false

jobs:
  build:
    name: Build Slidev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Getaran-Mekanik/Slides
        run: npm install

      - name: Build slide deck
        working-directory: Getaran-Mekanik/Slides
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Getaran-Mekanik/Slides/dist

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
