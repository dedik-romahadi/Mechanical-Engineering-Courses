name: Security Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend and Pages gates
        run: node scripts/validate-public-security.mjs

      - name: Render every KaTeX formula with the pages' KaTeX version
        # The repository has no node_modules: install the exact KaTeX version the pages load (VERSI_KATEX)
        # outside the checkout, then render every formula segment (a parse error = .katex-error in the browser).
        run: |
          VERSI_KATEX=$(node --input-type=module -e "import { VERSI_KATEX } from './scripts/periksa-katex.mjs'; console.log(VERSI_KATEX)")
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/katex" "katex@$VERSI_KATEX"
          node scripts/periksa-katex.mjs --katex "$RUNNER_TEMP/katex/node_modules/katex"

      - name: Validate modern academic module design
        run: node scripts/validate-all-course-modern-design.mjs

      - name: Validate Sisken modules, Export HTML, and Forum interactions
        run: |
          node scripts/validate-sisken-modules.mjs
          node scripts/validate-sisken-export-html.mjs
          node scripts/validate-sisken-forum.mjs

      - name: Validate computation answer candidates (numbers that are not labels)
        run: |
          node scripts/angka-tanpa-label.mjs --periksa
          node scripts/angka-tanpa-label.mjs --uji

      - name: Confirm backend is absent from public repository
        run: |
          test ! -e functions
          test ! -e .firebaserc
          test ! -e firebase.json
          test ! -e database.rules.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e .github/workflows/firebase-deploy-pilot.yml
