name: Security Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend and Pages gates
        run: node scripts/validate-public-security.mjs

      - name: Confirm backend is absent from public repository
        run: |
          test ! -e functions
          test ! -e .firebaserc
          test ! -e firebase.json
          test ! -e database.rules.json
          test ! -e firestore.rules
          test ! -e firestore.indexes.json
          test ! -e .github/workflows/firebase-deploy-pilot.yml
