name: Security Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend and Pages gates
        run: node scripts/validate-public-security.mjs

      - name: Validate backend JavaScript and JSON
        run: |
          node --check functions/index.js
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
