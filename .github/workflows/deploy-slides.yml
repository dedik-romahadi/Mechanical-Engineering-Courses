name: Deploy Slides ke GitHub Pages

on:
  # Deploy manual saja (jalankan dari tab Actions) — hindari deploy tiap push
  # selama masih tahap editing. Jalankan saat slide sudah final.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build kedua deck & Siapkan Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Getaran-Mekanik/Slides/package-lock.json
            Optimalisasi-dan-Automasi/Slides/package-lock.json

      # ── Getaran Mekanik — Analisis Getaran Berbasis Fourier Transform ──
      - name: Install dependencies — Getaran
        working-directory: Getaran-Mekanik/Slides
        run: npm ci

      - name: Build Slidev — Getaran (Fourier Transform)
        working-directory: Getaran-Mekanik/Slides
        run: |
          npx slidev build Analisis-Getaran-Berbasis-Fourier-Transform.md \
            --base /Mechanical-Engineering-Courses/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform/ \
            --out dist

      # ── Optimalisasi & Otomasi — Konsep Machine Learning ──
      - name: Install dependencies — Optimalisasi & Otomasi
        working-directory: Optimalisasi-dan-Automasi/Slides
        run: npm ci

      - name: Build Slidev — Opto (Konsep Machine Learning)
        working-directory: Optimalisasi-dan-Automasi/Slides
        run: |
          npx slidev build konsep-machine-learning.md \
            --base /Mechanical-Engineering-Courses/Optimalisasi-dan-Automasi/Slides/konsep-machine-learning/ \
            --out dist

      - name: Siapkan direktori Pages
        run: |
          mkdir -p _site
          # Copy seluruh repo kecuali .git, node_modules, dan direktori sumber Slides
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='Getaran-Mekanik/Slides/' \
            --exclude='Optimalisasi-dan-Automasi/Slides/' \
            . _site/
          # Copy build Slidev ke subdirektori URL masing-masing (sumber tetap flat di Slides/)
          mkdir -p _site/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform
          cp -r Getaran-Mekanik/Slides/dist/. _site/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform/
          mkdir -p _site/Optimalisasi-dan-Automasi/Slides/konsep-machine-learning
          cp -r Optimalisasi-dan-Automasi/Slides/dist/. _site/Optimalisasi-dan-Automasi/Slides/konsep-machine-learning/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
