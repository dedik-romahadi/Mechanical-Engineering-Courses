name: Deploy Slides ke GitHub Pages

on:
  # Deploy manual saja (jalankan dari tab Actions) — hindari deploy tiap push
  # selama masih tahap editing. Jalankan saat slide sudah final.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build tiap deck (toleran gagal) & Siapkan Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Getaran-Mekanik/Slides/package-lock.json
            Optimalisasi-dan-Automasi/Slides/package-lock.json
            PDD-UKTPT/Slides/package-lock.json

      # ──────────────────────────────────────────────────────────────────
      # Opsi A — isolasi build per mata kuliah.
      # Tiap deck di-install & di-build dengan continue-on-error, lalu pada
      # langkah "Siapkan direktori Pages" hanya deck yang BERHASIL build yang
      # disalin ke _site. Jadi 1 deck rusak TIDAK membatalkan deploy deck lain.
      # ──────────────────────────────────────────────────────────────────

      # ── Getaran Mekanik — Analisis Getaran Berbasis Fourier Transform ──
      - name: Install dependencies — Getaran
        working-directory: Getaran-Mekanik/Slides
        continue-on-error: true
        run: npm ci

      - name: Build Slidev — Getaran (Fourier Transform)
        working-directory: Getaran-Mekanik/Slides
        continue-on-error: true
        run: |
          npx slidev build Analisis-Getaran-Berbasis-Fourier-Transform.md \
            --base /Mechanical-Engineering-Courses/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform/ \
            --out dist

      # ── Optimalisasi & Otomasi — Penerapan Machine Learning ──
      - name: Install dependencies — Optimalisasi & Otomasi
        working-directory: Optimalisasi-dan-Automasi/Slides
        continue-on-error: true
        run: npm ci

      - name: Build Slidev — Opto (Penerapan Machine Learning)
        working-directory: Optimalisasi-dan-Automasi/Slides
        continue-on-error: true
        run: |
          npx slidev build penerapan-machine-learning.md \
            --base /Mechanical-Engineering-Courses/Optimalisasi-dan-Automasi/Slides/penerapan-machine-learning/ \
            --out dist

      # ── PDD-UKTPT — Pembukaan PDD-UKTPT (Bidang Pengajaran) ──
      - name: Install dependencies — PDD-UKTPT
        working-directory: PDD-UKTPT/Slides
        continue-on-error: true
        run: npm ci

      - name: Build Slidev — PDD-UKTPT (Pembukaan)
        working-directory: PDD-UKTPT/Slides
        continue-on-error: true
        run: |
          npx slidev build pembukaan-pdd-uktpt-bidang-pengajaran.md \
            --base /Mechanical-Engineering-Courses/PDD-UKTPT/Slides/pembukaan-pdd-uktpt-bidang-pengajaran/ \
            --out dist

      - name: Siapkan direktori Pages
        run: |
          mkdir -p _site
          # Copy seluruh repo kecuali .git, node_modules, dan direktori sumber Slides
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='Getaran-Mekanik/Slides/' \
            --exclude='Optimalisasi-dan-Automasi/Slides/' \
            --exclude='PDD-UKTPT/Slides/' \
            . _site/

          # Hanya salin deck yang BERHASIL build (cek index.html hasil slidev).
          built=0

          if [ -f Getaran-Mekanik/Slides/dist/index.html ]; then
            mkdir -p _site/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform
            cp -r Getaran-Mekanik/Slides/dist/. _site/Getaran-Mekanik/Slides/Analisis-Getaran-Berbasis-Fourier-Transform/
            echo "::notice title=Getaran::Build sukses — disertakan ke Pages."
            built=$((built+1))
          else
            echo "::warning title=Getaran::Build GAGAL — dilewati. Deck lain tetap deploy."
          fi

          if [ -f Optimalisasi-dan-Automasi/Slides/dist/index.html ]; then
            mkdir -p _site/Optimalisasi-dan-Automasi/Slides/penerapan-machine-learning
            cp -r Optimalisasi-dan-Automasi/Slides/dist/. _site/Optimalisasi-dan-Automasi/Slides/penerapan-machine-learning/
            echo "::notice title=Opto::Build sukses — disertakan ke Pages."
            built=$((built+1))
          else
            echo "::warning title=Opto::Build GAGAL — dilewati. Deck lain tetap deploy."
          fi

          if [ -f PDD-UKTPT/Slides/dist/index.html ]; then
            mkdir -p _site/PDD-UKTPT/Slides/pembukaan-pdd-uktpt-bidang-pengajaran
            cp -r PDD-UKTPT/Slides/dist/. _site/PDD-UKTPT/Slides/pembukaan-pdd-uktpt-bidang-pengajaran/
            echo "::notice title=PDD-UKTPT::Build sukses — disertakan ke Pages."
            built=$((built+1))
          else
            echo "::warning title=PDD-UKTPT::Build GAGAL — dilewati. Deck lain tetap deploy."
          fi

          if [ "$built" -eq 0 ]; then
            echo "::error::Tidak ada deck yang berhasil di-build — batalkan deploy."
            exit 1
          fi
          echo "Deck disertakan ke Pages: $built"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
