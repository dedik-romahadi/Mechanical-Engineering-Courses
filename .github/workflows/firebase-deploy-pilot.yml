name: Firebase Deploy Exam (multi-course)

# Manual trigger workflow untuk deploy Firestore rules, RTDB rules, Cloud
# Functions, dan seed exam answer keys. Support multi-course/multi-exam via
# input `exam_target` (pilih: getaran-mekanik-uts, getaran-mekanik-uas,
# optoauto-uts, all, dst — tambah di EXAMS map saat rollout exam baru).
#
# Setup PRASYARAT (sekali setup):
# 1. Download Service Account key dari Firebase Console:
#    Firebase Console → ⚙ Project settings → tab "Service accounts" →
#    "Generate new private key" → simpan file JSON.
# 2. Tambah roles tambahan ke service account (lewat Google Cloud Console → IAM):
#    - Firebase Admin                 (roles/firebase.admin)
#    - Cloud Functions Developer      (roles/cloudfunctions.developer)
#    - Service Account User           (roles/iam.serviceAccountUser)
#    - Cloud Build Editor             (roles/cloudbuild.builds.editor)
#    - Artifact Registry Writer       (roles/artifactregistry.writer)
#    Email SA biasanya: firebase-adminsdk-XXXXX@getaran-mekanik.iam.gserviceaccount.com
# 3. Upload SA key sebagai GitHub Secret:
#    Repo → Settings → Secrets and variables → Actions → "New repository secret"
#    Name: FIREBASE_SA_KEY
#    Value: paste ISI LENGKAP file JSON (mulai dari `{`, sampai `}`)
#
# Catatan: semua exam (Getaran, Optoauto, Math) deploy ke SATU Firebase project
# yang sama (`getaran-mekanik`). Multi-tenancy via Firestore path prefix
# (examAnswers/<examId>/qs/) dan RTDB path (visitors/<course>/<module>/).

on:
  workflow_dispatch:
    inputs:
      seed_scope:
        description: 'Scope seed (exam tertentu, modul tertentu, atau bulk)'
        type: choice
        required: true
        default: 'none'
        options:
          - none
          # ─── EXAM (6 total) ───
          - exam:getaran-mekanik-uts
          - exam:getaran-mekanik-uas
          - exam:optoauto-uts
          - exam:optoauto-uas
          - exam:math4-uts
          - exam:math4-uas
          - all-exam
          # ─── MODUL bulk (42 total per course) ───
          - all-modul-getaran-mekanik
          - all-modul-math4
          - all-modul-optoauto
          - all-modul
          # ─── Specific modul: pakai modul_custom_id field di bawah ───
          - modul:custom
          # ─── Combined ───
          - all
      modul_custom_id:
        description: 'Modul ID kalau pilih "modul:custom" di atas (mis. getaran-mekanik-modul-1)'
        type: string
        required: false
        default: ''
      dry_run_seed:
        description: 'Dry-run seed (preview soal, tanpa nulis ke Firestore)'
        type: boolean
        default: true
      deploy_rules:
        description: 'Deploy Firestore rules (deny-all)'
        type: boolean
        default: false
      live_seed:
        description: '⚠ LIVE seed → tulis answer keys ke Firestore (OVERWRITE jika sudah ada)'
        type: boolean
        default: false
      deploy_functions:
        description: 'Deploy Cloud Functions (checkExam/Modul + resetExam/Modul callables)'
        type: boolean
        default: false
      deploy_database_rules:
        description: 'Deploy RTDB rules (database.rules.json — utk Atur Jadwal, presence, dll)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Print plan
        run: |
          echo "─────────────────────────────────────────────────"
          echo "Deploy plan:"
          echo "  seed_scope:            ${{ inputs.seed_scope }}"
          echo "  modul_custom_id:       ${{ inputs.modul_custom_id }}"
          echo "  dry_run_seed:          ${{ inputs.dry_run_seed }}"
          echo "  deploy_rules:          ${{ inputs.deploy_rules }}"
          echo "  live_seed:             ${{ inputs.live_seed }}"
          echo "  deploy_functions:      ${{ inputs.deploy_functions }}"
          echo "  deploy_database_rules: ${{ inputs.deploy_database_rules }}"
          echo "─────────────────────────────────────────────────"

      - name: Compute seed flag
        id: seed_flag
        run: |
          SCOPE="${{ inputs.seed_scope }}"
          MODUL_CUSTOM="${{ inputs.modul_custom_id }}"
          case "$SCOPE" in
            none)
              echo "flag=" >> $GITHUB_OUTPUT
              echo "skip_seed=true" >> $GITHUB_OUTPUT
              ;;
            exam:*)
              EXAM_ID="${SCOPE#exam:}"
              echo "flag=--exam $EXAM_ID" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            all-exam)
              echo "flag=--all-exam" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            all-modul)
              echo "flag=--all-modul" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            all-modul-*)
              COURSE="${SCOPE#all-modul-}"
              # Use Node to expand --modul flags for given course prefix
              FLAGS=""
              for i in $(seq 1 14); do
                FLAGS="$FLAGS --modul ${COURSE}-modul-$i"
              done
              echo "flag=$FLAGS" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            modul:custom)
              if [ -z "$MODUL_CUSTOM" ]; then
                echo "❌ modul:custom dipilih tapi modul_custom_id kosong"
                exit 1
              fi
              echo "flag=--modul $MODUL_CUSTOM" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            all)
              echo "flag=--all" >> $GITHUB_OUTPUT
              echo "skip_seed=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unknown seed_scope: $SCOPE"
              exit 1
              ;;
          esac

      - name: Step 1 — Dry-run seed
        if: ${{ inputs.dry_run_seed && steps.seed_flag.outputs.skip_seed != 'true' }}
        working-directory: functions
        run: node seed/seed-firestore.js ${{ steps.seed_flag.outputs.flag }} --dry-run

      - name: Step 2 — Deploy Firestore rules
        if: ${{ inputs.deploy_rules }}
        run: firebase deploy --only firestore:rules --project getaran-mekanik --non-interactive

      - name: Step 3 — LIVE seed (write answer keys to Firestore)
        if: ${{ inputs.live_seed && steps.seed_flag.outputs.skip_seed != 'true' }}
        working-directory: functions
        run: node seed/seed-firestore.js ${{ steps.seed_flag.outputs.flag }}

      - name: Step 4 — Deploy Cloud Functions
        if: ${{ inputs.deploy_functions }}
        run: firebase deploy --only functions --project getaran-mekanik --non-interactive --force

      - name: Step 5 — Deploy RTDB rules
        if: ${{ inputs.deploy_database_rules }}
        run: firebase deploy --only database --project getaran-mekanik --non-interactive

      - name: Summary
        if: always()
        run: |
          echo "─────────────────────────────────────────────────"
          echo "Selesai. Verifikasi di Firebase Console:"
          echo "  • Firestore → examAnswers/<examId>/qs/ atau modulAnswers/<modulId>/qs/"
          echo "  • Functions → checkExam/Modul + resetExam/Modul callables (asia-southeast1)"
          echo "─────────────────────────────────────────────────"
